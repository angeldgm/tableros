<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tableros</title>

    <style>
        :root {
            color-scheme: light;
            --background: #f3f5fa;
            --surface: #ffffff;
            --surface-muted: #f7f8fc;
            --border: #dfe3ec;
            --text: #1d2433;
            --muted: #697386;
            --primary: #5865e8;
            --primary-hover: #4652d4;
            --danger: #c9364f;
            --shadow: 0 12px 30px rgb(32 42 68 / 8%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        html.dark {
            filter: invert(1) hue-rotate(180deg);
        }

        html.dark img,
        html.dark video,
        html.dark canvas,
        html.dark picture {
            filter: invert(1) hue-rotate(180deg);
        }

        button,
        input,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        [hidden] {
            display: none !important;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .toolbar {
            display: flex;
            /* position: sticky; */
            position: fixed;
            /* top: 0; */
            bottom: 0;
            border-radius: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            align-items: center;
            gap: 1rem;
            padding: 0.85rem 1.25rem;
            background: rgb(255 255 255 / 92%);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-size: 1.05rem;
            font-weight: 750;
            white-space: nowrap;
        }

        .brand-icon {
            display: grid;
            width: 2rem;
            height: 2rem;
            place-items: center;
            color: white;
            background: var(--primary);
            border-radius: 0.65rem;
        }

        /* .board-picker {
            display: 1;
            min-width: 0;
            align-items: center;
            gap: 0.55rem;
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 650;
        }

        .board-picker select {
            min-width: 5rem;
            max-width: 10rem;
            padding: 0.55rem 2rem 0.55rem 0.7rem;
            color: var(--text);
            background: var(--surface-muted);
            border: 1px solid var(--border);
            border-radius: 0.6rem;
        } */

        .board-picker {
            position: relative;
            display: inline-block;
        }

        #board-menu-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: inherit;
        }

        #board-menu-button:hover {
            background: #eee;
            border-radius: 6px;
        }

        .board-menu {
            position: absolute;
            bottom: 100%;
            left: 0;
            z-index: 1000;
            min-width: 180px;
            margin: 4px 0 0;
            padding: 4px;
            list-style: none;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgb(0 0 0 / 12%);
        }

        .board-menu li {
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .board-menu li:hover,
        .board-menu li[aria-selected="true"] {
            background: #eee;
        }

        .toolbar-actions,
        .board-actions,
        .composer-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .toolbar-actions-item {
            display: inline-block;
        }

        .toolbar-actions {
            margin-left: auto;
        }

        .app-shell {
            width: min(1500px, 100%);
            margin: 0 auto;
            padding: 1.5rem 0rem 3rem;
        }

        .board-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding: 0rem 1.25rem 1.25rem;
        }

        .board-name {
            width: min(36rem, 100%);
            padding: 0;
            color: var(--text);
            background: transparent;
            border: 0;
            outline: 0;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 780;
        }

        .board-name:focus {
            border-bottom: 2px solid var(--primary);
        }

        .hint {
            margin: 0.35rem 0 0;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .button {
            padding: 0.55rem 0.8rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.65rem;
            font-weight: 650;
        }

        .button:hover:not(:disabled) {
            background: var(--surface-muted);
        }

        .button.primary {
            color: white;
            background: var(--primary);
            border-color: var(--primary);
        }

        .button.primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .button.danger {
            color: var(--danger);
        }

        .button.small {
            padding: 0.35rem 0.55rem;
            font-size: 0.8rem;
            border: none;
            opacity: 0.2;
        }

        .editor-toolbar .active {
            background-color: black;
            color: white;
        }

        .columns {
            display: flex;
            align-items: flex-start;
            min-height: 20rem;
            padding-bottom: 1rem;
            overflow-x: auto;
        }

        .column {
            flex: 0 0 350px;
            max-width: 100%;
            padding: 0.9rem;
            background: #e9ecf5;
            border: 1px solid #dde1ed;
            border-radius: 1.15rem;
            box-shadow: var(--shadow);
        }

        .column-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }

        .column-title {
            min-width: 0;
            flex: 1;
            padding: 0.35rem 0.2rem;
            color: var(--text);
            background: transparent;
            border: 0;
            border-bottom: 1px solid transparent;
            outline: 0;
            font-size: 1rem;
            font-weight: 750;
        }

        .column-title:focus {
            border-bottom-color: var(--primary);
        }

        .item-list {
            min-height: 3rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .empty-column {
            padding: 1.25rem 0.5rem;
            color: var(--muted);
            text-align: center;
            font-size: 0.88rem;
        }

        .item {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: start;
            gap: 0.55rem;
            margin-bottom: 0.65rem;
            padding: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 0.85rem;
            box-shadow: 0 3px 10px rgb(32 42 68 / 4%);
        }

        .item.dragging {
            opacity: 0.35;
        }

        .drag-handle {
            padding: 0.15rem;
            color: #9199aa;
            background: transparent;
            border: 0;
            cursor: grab;
            font-size: 1.1rem;
            line-height: 1.2;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .item-body {
            min-width: 0;
        }

        .item-actions {
            display: flex;
            gap: 0.25rem;
        }

        .rich-content {
            overflow-wrap: anywhere;
            line-height: 1.5;
        }

        .rich-content > :first-child {
            margin-top: 0;
        }

        .rich-content > :last-child {
            margin-bottom: 0;
        }

        .rich-content a,
        .editor a {
            color: var(--primary);
        }

        .photo-preview {
            margin: 0;
        }

        .photo-preview img {
            display: block;
            width: 100%;
            max-height: 22rem;
            object-fit: contain;
            background: #eef0f5;
            border-radius: 0.65rem;
        }

        .photo-preview figcaption {
            margin-top: 0.4rem;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .drop-placeholder {
            height: 0.4rem;
            margin: 0.25rem 0;
            background: var(--primary);
            border-radius: 999px;
        }

        .composer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 0.85rem;
            padding: 0.75rem;
            background: rgb(255 255 255 / 78%);
            border: 1px solid var(--border);
            border-radius: 0.85rem;
            opacity: 0.5;
        }

        .composer:hover {
            opacity: 0.9;
        }

        .composer-tabs {
            display: flex;
            gap: 0.35rem;
            margin-bottom: 0.65rem;
        }

        .composer-tab {
            flex: 1;
            padding: 0.45rem;
            color: var(--muted);
            background: transparent;
            border: 1px solid transparent;
            border-radius: 0.55rem;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .composer-tab.active {
            color: var(--primary);
            background: white;
            border-color: #cfd3ff;
        }

        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
            margin-bottom: 0.45rem;
        }

        .editor-toolbar button {
            min-width: 2rem;
            padding: 0.3rem 0.5rem;
            color: var(--text);
            background: white;
            border: 1px solid var(--border);
            border-radius: 0.45rem;
        }

        .editor {
            min-height: 7rem;
            max-height: 20rem;
            max-width: 18rem;
            padding: 0.65rem;
            overflow-y: auto;
            background: white;
            border: 1px solid var(--border);
            border-radius: 0.65rem;
            outline: 0;
            line-height: 1.45;
        }

        .editor:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgb(88 101 232 / 12%);
        }

        .editor:empty::before {
            color: #9aa1b1;
            content: attr(data-placeholder);
            pointer-events: none;
        }

        .photo-controls {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .file-button {
            position: relative;
            display: inline-block;
        }

        .photo-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .selected-photo {
            margin-top: 0.65rem;
        }

        .selected-photo img {
            display: block;
            width: 100%;
            max-height: 12rem;
            object-fit: contain;
            background: white;
            border-radius: 0.65rem;
        }

        .selected-photo-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-top: 0.45rem;
        }

        .composer-actions {
            margin-top: 0.7rem;
        }

        .empty-state {
            width: 100%;
            padding: 4rem 1rem;
            color: var(--muted);
            text-align: center;
        }

        .toast {
            position: fixed;
            right: 1rem;
            bottom: 1rem;
            z-index: 50;
            max-width: min(28rem, calc(100vw - 2rem));
            padding: 0.8rem 1rem;
            color: white;
            background: #252b3a;
            border-radius: 0.75rem;
            box-shadow: 0 12px 30px rgb(0 0 0 / 20%);
            opacity: 0;
            transform: translateY(1rem);
            transition: opacity 150ms ease, transform 150ms ease;
            pointer-events: none;
        }

        .toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.success {
            background: #267452;
        }

        .toast.error {
            background: #a92f46;
        }

        .transparent {
            opacity: 0.5;
        }

        .center {
            text-align: center;
        }

        @media (max-width: 500px) {
            .column {
                flex: 0 0 90%;
            }

            /* .toolbar {
                align-items: stretch;
                flex-wrap: wrap;
            }

            .toolbar-actions {
                width: 100%;
                margin-left: 0;
                overflow-x: auto;
            } */

            /* .board-header {
                flex-direction: column;
            } */

            /* .board-actions {
                width: 100%;
            } */

            .column {
                flex-basis: 88vw;
            }
        }
    </style>
</head>

<body>
    <header class="toolbar">
        <div class="toolbar-actions">
            <label class="board-picker">
                <button
                    type="button"
                    id="board-menu-button"
                    class="toolbar-actions-item button small"
                    aria-label="Escoger tablero"
                    aria-expanded="false"
                    aria-controls="board-menu"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="24"
                        height="24"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    >
                        <path d="M4 6h16" />
                        <path d="M4 12h16" />
                        <path d="M4 18h16" />
                    </svg>
                </button>

                <select id="board-select" hidden></select>

                <ul id="board-menu" class="board-menu" hidden></ul>
            </label>
            <!-- <button id="new-board" class="toolbar-actions-item button small" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     aria-label="Añadir tablero" role="img">
                  <path d="M12 5v14"/>
                  <path d="M5 12h14"/>
                </svg>
            </button>
            <button id="delete-board" class="toolbar-actions-item button small" type="button">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18" />
                    <path d="M8 6V4h8v2" />
                    <path d="m19 6-1 14H6L5 6" />
                    <path d="M10 11v5M14 11v5" />
                </svg>
            </button> -->
            <button id="toggle-theme" class="toolbar-actions-item button small" type="button">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    role="img"
                    aria-label="Theme palette"
                >
                    <path d="M12 3a9 9 0 1 0 0 18h1.2a2 2 0 0 0 1.5-3.3 1.7 1.7 0 0 1 1.3-2.8H18a3 3 0 0 0 3-3c0-5-4-8.9-9-8.9Z"/>
                    <circle cx="7.5" cy="11" r="1"/>
                    <circle cx="10" cy="7.5" r="1"/>
                    <circle cx="14" cy="7.5" r="1"/>
                    <circle cx="17" cy="10.5" r="1"/>
                </svg>
            </button>
            <button id="import-board" class="toolbar-actions-item button small" type="button">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                </svg>
            </button>
            <button id="export-board" class="toolbar-actions-item button small" type="button">
                <!-- <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M12 3v12"/>
                    <path d="m7 10 5 5 5-5"/>
                    <path d="M5 20h14"/>
                </svg> -->
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <circle cx="18" cy="5" r="3"/>
                    <circle cx="6" cy="12" r="3"/>
                    <circle cx="18" cy="19" r="3"/>
                    <path d="m8.59 13.51 6.83 3.98"/>
                    <path d="m15.41 6.51-6.82 3.98"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="app-shell">
        <section class="board-header">
            <div>
                <label class="sr-only" for="board-name">Nombre del tablero</label>
                <input
                    id="board-name"
                    class="board-name"
                    type="text"
                    maxlength="120"
                    placeholder="Tablero sin título"
                >
                <p class="hint">
                    
                </p>
            </div>

            <div class="board-actions">
                <button id="add-column" class="button small" type="button">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-label="Añadir columna"
                        role="img"
                        >
                        <rect x="3" y="4" width="11" height="16" rx="1.5" />
                        <path d="M8.5 4v16M17 12h5m-2.5-2.5v5" />
                    </svg>
                </button>
            </div>
        </section>

        <section id="columns" class="columns" aria-label="Board columns"></section>

        <section class="center">
            <br>
            <button id="download-app" class="button transparent">Descargar esta página</button>
            <br>
            <br>
            <br>
        </section>
    </main>

    <input
        id="import-file"
        type="file"
        accept="application/json,.json"
        hidden
    >

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
        "use strict";

        const STORAGE_KEY = "board-editor-v1";
        const STORAGE_KEY_DARK_THEME = "board-editor-v1-theme";
        const MAX_PHOTO_BYTES = 8 * 1024 * 1024;

        const ui = {
            boardSelect: document.getElementById("board-select"),
            boardMenuButton: document.getElementById("board-menu-button"),
            boardMenu: document.getElementById("board-menu"),
            boardName: document.getElementById("board-name"),
            // newBoard: document.getElementById("new-board"),
            importBoard: document.getElementById("import-board"),
            exportBoard: document.getElementById("export-board"),
            importFile: document.getElementById("import-file"),
            addColumn: document.getElementById("add-column"),
            // deleteBoard: document.getElementById("delete-board"),
            columns: document.getElementById("columns"),
            toast: document.getElementById("toast"),
            downloadAppButton: document.getElementById("download-app"),
            toggleThemeButton: document.getElementById("toggle-theme")
        };

        let isDarkTheme = getThemeLocally();
        if (isDarkTheme === "1") {
            toggleTheme();
        }
        ui.toggleThemeButton.addEventListener("click", () => {
            toggleTheme();
            isDarkTheme = isDarkTheme === "1" ? "0" : "1";
            persistThemeOrWarn();
        })

        ui.downloadAppButton.addEventListener("click", () => {
            const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([html], { type: "text/html;charset=utf-8" });
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = "tableros.html";
            link.click();

            URL.revokeObjectURL(url);
        });

        let boardData = loadBoardData();
        let currentBoardId = boardData.boards[0]?.id ?? null;
        let editingItem = null;
        let dragState = null;
        let toastTimer = null;
        let persistTimer = null;

        const pendingPhotos = new Map();
        const loadingPhotos = new Set();
        const photoReadVersions = new Map();

        function renderMenu() {
            ui.boardMenu.replaceChildren();

            Array.from(ui.boardSelect.options).forEach((option) => {
                const item = document.createElement("li");

                item.textContent = option.textContent;
                item.setAttribute(
                    "aria-selected",
                    String(option.value === ui.boardSelect.value)
                );

                item.addEventListener("click", () => {
                    ui.boardSelect.value = option.value;
                    ui.boardSelect.dispatchEvent(
                        new Event("change", { bubbles: true })
                    );

                    ui.boardMenu.hidden = true;
                    ui.boardMenuButton.setAttribute("aria-expanded", "false");
                });

                ui.boardMenu.appendChild(item);
            });

            let itemAdd = document.createElement("li");
            itemAdd.textContent = "✚ Añadir tablero";
            itemAdd.addEventListener("click", addBoard);
            ui.boardMenu.appendChild(itemAdd);

            const itemDelete = document.createElement("li");
            itemDelete.textContent = "✖ Eliminar tablero actual";
            itemDelete.addEventListener("click", deleteBoard);
            ui.boardMenu.appendChild(itemDelete);
        }

        ui.boardMenuButton.addEventListener("click", () => {
            const isOpening = ui.boardMenu.hidden;

            if (isOpening) {
                renderMenu();
            }

            ui.boardMenu.hidden = !isOpening;
            ui.boardMenuButton.setAttribute("aria-expanded", String(isOpening));
        });

        // Close when clicking outside the menu
        document.addEventListener("click", (event) => {
            if (!event.target.closest(".board-picker")) {
                ui.boardMenu.hidden = true;
                ui.boardMenuButton.setAttribute("aria-expanded", "false");
            }
        });

        function makeId(prefix) {
            if (window.crypto && typeof window.crypto.randomUUID === "function") {
                return `${prefix}-${window.crypto.randomUUID()}`;
            }

            return `${prefix}-${Date.now().toString(36)}-${Math.random()
                .toString(36)
                .slice(2)}`;
        }

        function escapeHtml(value) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            };

            return String(value).replace(/[&<>"']/g, character => entities[character]);
        }

        function isSafeLink(value) {
            if (!value) {
                return false;
            }

            try {
                const url = new URL(value, window.location.href);
                return ["http:", "https:", "mailto:", "tel:"].includes(url.protocol);
            } catch {
                return false;
            }
        }

        function isSafePhotoDataUrl(value) {
            return /^data:image\/(?:png|jpeg|jpg|gif|webp|avif);base64,[a-z0-9+/=\s]+$/i.test(
                String(value)
            );
        }

        function sanitizeRichText(html) {
            const parser = new DOMParser();
            const documentFragment = parser.parseFromString(String(html), "text/html");
            const allowedTags = new Set([
                "P",
                "DIV",
                "BR",
                "B",
                "STRONG",
                "I",
                "EM",
                "U",
                "A",
                "UL",
                "OL",
                "LI",
                "SPAN",
                "BLOCKQUOTE"
            ]);

            function cleanChildren(parent) {
                Array.from(parent.children).forEach(element => {
                    if (!allowedTags.has(element.tagName)) {
                        element.replaceWith(
                            documentFragment.createTextNode(element.textContent || "")
                        );
                        return;
                    }

                    Array.from(element.attributes).forEach(attribute => {
                        const isSafeAnchorHref =
                            element.tagName === "A" &&
                            attribute.name.toLowerCase() === "href";

                        if (!isSafeAnchorHref) {
                            element.removeAttribute(attribute.name);
                        }
                    });

                    if (element.tagName === "A") {
                        const href = (element.getAttribute("href") || "").trim();

                        if (isSafeLink(href)) {
                            element.setAttribute("href", href);
                            element.setAttribute("target", "_blank");
                            element.setAttribute("rel", "noopener noreferrer");
                        } else {
                            element.removeAttribute("href");
                            element.removeAttribute("target");
                            element.removeAttribute("rel");
                        }
                    }

                    cleanChildren(element);
                });
            }

            cleanChildren(documentFragment.body);
            return documentFragment.body.innerHTML;
        }

        function linkifyTextNodes(root) {
            const walker = document.createTreeWalker(
                root,
                NodeFilter.SHOW_TEXT,
                {
                    acceptNode(node) {
                        // Don't linkify text that's already inside a link or non-text element.
                        if (node.parentElement?.closest("a, script, style, textarea")) {
                            return NodeFilter.FILTER_REJECT;
                        }
                        return NodeFilter.FILTER_ACCEPT;
                    }
                }
            );

            const textNodes = [];
            while (walker.nextNode()) textNodes.push(walker.currentNode);

            const urlRegex = /\bhttps?:\/\/[^\s<]+/gi;

            for (const textNode of textNodes) {
                const text = textNode.nodeValue;
                const fragment = document.createDocumentFragment();
                let lastIndex = 0;
                let match;

                urlRegex.lastIndex = 0;

                while ((match = urlRegex.exec(text))) {
                    // Leave common closing punctuation outside the link.
                    const url = match[0].replace(/[),.!?;:]+$/, "");
                    if (!url) continue;

                    const start = match.index;
                    const end = start + url.length;

                    fragment.append(
                        document.createTextNode(text.slice(lastIndex, start))
                    );

                    const link = document.createElement("a");
                    link.href = url;
                    link.textContent = url;
                    fragment.append(link);

                    lastIndex = end;
                }

                if (lastIndex) {
                    fragment.append(document.createTextNode(text.slice(lastIndex)));
                    textNode.replaceWith(fragment);
                }
            }
        }

        function toSafeRichText(value) {
            const text = String(value ?? "");
            if (!text.trim()) return "";

            const looksLikeHtml =
                /<\/?(?:p|div|br|b|strong|i|em|u|a|ul|ol|li|blockquote)\b/i.test(text);

            const html = looksLikeHtml
                ? sanitizeRichText(text)
                : sanitizeRichText(
                    `<div>${escapeHtml(text).replace(/\r?\n/g, "<br>")}</div>`
                );

            const container = document.createElement("div");
            container.innerHTML = html;

            linkifyTextNodes(container);

            // Sanitize again so the generated markup also passes your sanitizer.
            return sanitizeRichText(container.innerHTML);
        }

        function uniqueId(preferred, prefix, usedIds) {
            let id = String(preferred ?? "").trim();

            if (!id) {
                id = makeId(prefix);
            }

            while (usedIds.has(id)) {
                id = makeId(prefix);
            }

            usedIds.add(id);
            return id;
        }

        function normalizeChild(rawChild, usedItemIds) {
            const child = rawChild && typeof rawChild === "object" ? rawChild : {};
            const id = uniqueId(child.id, "item", usedItemIds);

            if (child.type === "photo") {
                let content = String(
                    child.content ??
                    child.dataUrl ??
                    child.src ??
                    child.base64 ??
                    ""
                );

                if (
                    content &&
                    !content.startsWith("data:") &&
                    /^[a-z0-9+/=\s]+$/i.test(content)
                ) {
                    content = `data:image/jpeg;base64,${content.replace(/\s/g, "")}`;
                }

                return {
                    id,
                    type: "photo",
                    content: isSafePhotoDataUrl(content) ? content : "",
                    name: String(child.name ?? child.alt ?? "Photo")
                };
            }

            const content = child.content ?? child.html ?? child.text ?? "";

            return {
                id,
                type: "text",
                content: toSafeRichText(content)
            };
        }

        function normalizeData(rawData) {
            let sourceBoards = [];

            if (Array.isArray(rawData)) {
                sourceBoards = rawData;
            } else if (rawData && Array.isArray(rawData.boards)) {
                sourceBoards = rawData.boards;
            } else if (rawData && Array.isArray(rawData.columns)) {
                // Supports the original format:
                // { board: "New York", columns: [...] }
                sourceBoards = [rawData];
            }

            const usedBoardIds = new Set();

            const boards = sourceBoards.map((rawBoard, boardIndex) => {
                const board = rawBoard && typeof rawBoard === "object" ? rawBoard : {};
                const boardId = uniqueId(board.id, "board", usedBoardIds);
                const usedColumnIds = new Set();
                const usedItemIds = new Set();
                const sourceColumns = Array.isArray(board.columns) ? board.columns : [];

                const columns = sourceColumns.map((rawColumn, columnIndex) => {
                    const column =
                        rawColumn && typeof rawColumn === "object" ? rawColumn : {};

                    const columnId = uniqueId(
                        column.id,
                        "column",
                        usedColumnIds
                    );

                    const sourceChildren = Array.isArray(column.children)
                        ? column.children
                        : [];

                    return {
                        id: columnId,
                        title: String(
                            column.title ?? column.name ?? `Columna ${columnIndex + 1}`
                        ),
                        children: sourceChildren.map(child =>
                            normalizeChild(child, usedItemIds)
                        )
                    };
                });

                return {
                    id: boardId,
                    name: String(
                        board.name ?? board.board ?? `Tablero ${boardIndex + 1}`
                    ),
                    columns
                };
            });

            return {
                version: 1,
                boards
            };
        }

        function loadBoardData() {
            try {
                const stored = window.localStorage.getItem(STORAGE_KEY);

                if (stored) {
                    const normalized = normalizeData(JSON.parse(stored));

                    if (normalized.boards.length) {
                        return normalized;
                    }
                }
            } catch (error) {
                console.warn("No se pudieron cargar los datos.", error);
            }

            return createDefaultData();
        }

        function saveLocally() {
            try {
                window.localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(boardData)
                );
                return true;
            } catch (error) {
                console.warn("No se pudieron guardar los datos.", error);
                return false;
            }
        }

        function getThemeLocally() {
            return window.localStorage.getItem(STORAGE_KEY_DARK_THEME) ?? "0";
        }

        function saveThemeLocally() {
            try {
                window.localStorage.setItem(
                    STORAGE_KEY_DARK_THEME,
                    isDarkTheme
                );
                return true;
            } catch (error) {
                console.warn("No se pudieron guardar los datos.", error);
                return false;
            }
        }

        function showStorageWarning() {
            showToast(
                "El cambio está disponible en memoria, pero el almacenamiento del navegador está lleno o no disponible.",
                "error"
            );
        }

        function persistOrWarn() {
            if (!saveLocally()) {
                showStorageWarning();
            }
        }

        function persistThemeOrWarn() {
            if (!saveThemeLocally()) {
                showStorageWarning();
            }
        }

        function toggleTheme() {
            // document.documentElement.style.filter = document.documentElement.style.filter ? "" : "invert(1)";
            document.documentElement.classList.toggle("dark");
        }

        function schedulePersist() {
            window.clearTimeout(persistTimer);
            persistTimer = window.setTimeout(persistOrWarn, 300);
        }

        function flushScheduledPersist() {
            window.clearTimeout(persistTimer);
            persistTimer = null;
            persistOrWarn();
        }

        function showToast(message, type = "info") {
            window.clearTimeout(toastTimer);
            ui.toast.textContent = message;
            ui.toast.className = `toast visible ${type}`;

            toastTimer = window.setTimeout(() => {
                ui.toast.className = "toast";
            }, 3500);
        }

        function commitAndRender(message = "") {
            const stored = saveLocally();
            render();

            if (stored) {
                if (message) {
                    showToast(message, "success");
                }
            } else {
                showStorageWarning();
            }
        }

        function getCurrentBoard() {
            return (
                boardData.boards.find(board => board.id === currentBoardId) ??
                null
            );
        }

        function getColumn(board, columnId) {
            return board?.columns.find(column => column.id === columnId) ?? null;
        }

        function getComposer(columnId) {
            return Array.from(
                ui.columns.querySelectorAll(".composer")
            ).find(composer => composer.dataset.columnId === columnId) ?? null;
        }

        function render() {
            if (!boardData.boards.some(board => board.id === currentBoardId)) {
                currentBoardId = boardData.boards[0]?.id ?? null;
            }

            const options = boardData.boards.map(board => {
                const option = document.createElement("option");
                option.value = board.id;
                option.textContent = board.name || "Tablero sin título";
                return option;
            });

            ui.boardSelect.replaceChildren(...options);
            ui.boardSelect.disabled = boardData.boards.length === 0;
            ui.boardSelect.value = currentBoardId ?? "";

            const board = getCurrentBoard();

            ui.boardName.value = board?.name ?? "";
            ui.boardName.disabled = !board;
            ui.addColumn.disabled = !board;
            // ui.deleteBoard.disabled = !board || boardData.boards.length <= 1;

            if (!board) {
                ui.columns.innerHTML = `
                    <div class="empty-state">
                        <h2>No hay tableros</h2>
                        <p>Puedes crear un tablero o importar datos</p>
                    </div>
                `;
                return;
            }

            ui.columns.innerHTML = board.columns.length
                ? board.columns.map(renderColumn).join("")
                : `
                    <div class="empty-state">
                        <h2>Este tablero no tiene columnas</h2>
                        <p>Prueba a añadir una columna</p>
                    </div>
                `;
        }

        function renderColumn(column, index) {

            // <button
            //     data-action="format"
            //     data-command="createLink"
            //     type="button"
            //     title="Añadir enlance"
            // >

                                <rect x="3" y="4" width="18" height="8" rx="1.5"></rect>

                        <button
                            class="button small minus-icon"

                            type="button"
                            title="Ocultar editor"

                                <path d="M5 12h14" />

                        <div class="composer-content" hidden>
                            <div class="composer-tabs" role="group" aria-label="Item type">
                                <button
                                    class="composer-tab active"
                                    data-action="composer-type"
                                    data-composer-type="text"
                                    type="button"
                                    aria-pressed="true"
                                >
                                    Texto
                                </button>

                                <button
                                    class="composer-tab"
                                    data-action="composer-type"
                                    data-composer-type="photo"

                                    aria-pressed="false"

                                    Foto
                                </button>

                            <div data-panel="text">
                                <div class="editor-toolbar" aria-label="Text formatting">
                                    <button
                                        data-action="format"
                                        data-command="bold"
                                        type="button"
                                        title="Bold"

                                        <strong>B</strong>

                                    <button

                                    class="editor"

                                            class="sr-only"

                                            type="file"

                                    </span>

                                            class="button small danger"

            return html;
